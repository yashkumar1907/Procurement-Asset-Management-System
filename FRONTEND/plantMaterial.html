<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Material</title>
    <link rel="stylesheet" href="plantMaterial.css">
    <link rel="stylesheet" href="toast.css">
    <link rel="stylesheet" href="confirm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
</head>
<body>

    <!-- =========================
        NAVBAR
    ========================= -->
    <div class="navbar">
        <div class="logo">
            <img src="JSL Logo.jpg" height="35" alt="JSL Logo">
        </div>
        <div class="user-info">
            Welcome, User
            <button type="button" class="logout-btn" onclick="logout(event)">
                Logout
            </button>
        </div>
    </div>

    <!-- =========================
        MAIN LAYOUT
    ========================= -->
    <div class="dashboard-layout">

        <!-- =========================
            SIDEBAR
        ========================= -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="toggleSidebarBtn" class="toggle-sidebar">☰</button>
            </div>

            <button id="dashboardBtn" class="sidebar-btn" onclick="window.location.href='dashboard.html'">📦 Dashboard</button>
            <button id="networkBtn" class="sidebar-btn" onclick="window.location.href='network.html'">🌐 Network and Bandwidth Management</button>
            <button id="amcBtn" class="sidebar-btn" onclick="window.location.href='amc.html'">🛠 Annual Maintenance Contract</button>
            <button id="contractBtn" class="sidebar-btn" onclick="window.location.href='contract.html'">📋 Contract Resource and Support PRs</button>

            <button id="inventoryToggleBtn" class="sidebar-btn">📦 IT Procurement ▼</button>
            <div id="inventorySubMenu" class="inventory-submenu">
                <button id="inventoryNetworkBtn" class="sidebar-btn inventory-sub-btn" onclick="window.location.href='inventoryNetwork.html'">Network Accel IT</button>
                <button id="inventoryHardwareBtn" class="sidebar-btn inventory-sub-btn" onclick="window.location.href='inventoryHardware.html'">Hardware CMS</button>
                <button id="inventoryDepartmentBtn" class="sidebar-btn inventory-sub-btn" onclick="window.location.href='inventoryDepartment.html'">IT Department Indent</button>
            </div>


            <button id="plantToggleBtn" class="sidebar-btn active">📦 Plants ▲</button>
            <div id="plantSubMenu" class="plant-submenu show">
                <button id="plantMaterialBtn" class="sidebar-btn plant-sub-btn active">Plant Material</button>
                <button id="plantServiceBtn" class="sidebar-btn plant-sub-btn" onclick="window.location.href='plantService.html'">Plant Service</button>
            </div>

            <button id="wbsProjectBtn" class="sidebar-btn" onclick="window.location.href='wbsProject.html'">📦 WBS (Project)</button>

            <button class="sidebar-btn" onclick="window.location.href='profile.html'">👤 View Profile</button>

        </div>

        <!-- =========================
            CONTENT AREA
        ========================= -->
        <div class="content-area">

            <!-- =========================
                MODULE SECTION
            ========================= -->
                <div class="dashboard-heading">
                    <h1>PLANT (MATERIALS)</h1>
                </div>

                <div class="stats-container">
                    <div class="stat-card">
                        <h3>Total Records</h3>
                        <p id="totalRecords">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total PR Amount</h3>
                        <p id="totalPrAmount">₹0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total PO Amount</h3>
                        <p id="totalPoAmount">₹0</p>
                    </div>
                </div>
                
                <div class="top-actions">
                    <button class="add-btn" onclick="openAddModal()">+ Add Record</button>
                    <button class="export-btn" onclick="exportExcel()">Export Excel</button>
                    
                    <button class="import-btn" onclick="document.getElementById('importExcelFile').click()">Import Excel</button>
                    <input type="file" id="importExcelFile" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">

                    <input type="text" id="searchBox" class="search-box" placeholder="Search by PR Number or PO Number..." oninput="renderTable()">
                </div>

                <div id="tableContainer" class="table-container">
                    <p class="no-data">No Records Found</p>
                </div>
        </div>
    </div>

    <!-- =========================
        RECORD MODAL
    ========================= -->
    <div id="recordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Add New Record</h2>
            <form id="recordForm" onsubmit="addRecord(event)">

                <input type="text" id="year" placeholder="Year" required>
                <input type="text" id="yearMonth" placeholder="Year / Month" required>
                
                <div class="po-box">
                    <label>Requirement Date</label>
                    <input type="date" id="requirementDate" required>
                </div>
                
                <input type="text" id="reqIndentorName" placeholder="REQ. INDENTOR NAME" required>
                <input type="text" id="reqIndentorDept" placeholder="REQ. INDENTOR DEPT." required>
                <input type="text" id="requirement" placeholder="Requirement" required>

                <div id="serviceSection">
                    <div class="service-header">
                        <h3>Plant Material Details</h3>
                        <button type="button" class="add-service-btn" onclick="addMaterialRow()">
                            + Add More Plant Material Items
                        </button>
                        <p id="serviceCountText">
                            Total Plant Material Items Added: 0
                        </p>
                    </div>
                    <div id="serviceContainer"></div>
                </div>


                <input type="text" id="prNum" placeholder="Indent / PR" required>
                <input type="text" id="poNum" placeholder="PO">
                <input type="text" id="purchaserName" placeholder="Purchaser Name">
                <input type="text" id="currentProgress" placeholder="Current Progress">
                <input type="text" id="trackingId" placeholder="TRACKING ID">
                <input type="text" id="costCentre" placeholder="COST CENTRE">
                <input type="text" id="projectName" placeholder="Project Name / WBS">
                <input type="text" id="indentMailRequest" placeholder="Indent Mail Request">
                <input type="text" id="remark" placeholder="Remark">
                
                <div class="po-box">
                    <label>Material / Service Delivery Date</label>
                    <input type="date" id="materialDeliveryDate">
                </div>
                
                <input type="text" id="materialReceived" placeholder="Material Received">
                <input type="text" id="srrCleared" placeholder="SRR Cleared">

                <button type="submit">Save Record</button>
            </form>
        </div>
    </div>
    

    <script src="config.js"></script>
    <script src="toast.js"></script>
    <script src="confirm.js"></script>
    <script src="plantMaterial.js"></script>
</body>
</html>
